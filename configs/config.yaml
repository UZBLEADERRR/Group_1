# SmartRoom AI Configuration
camera:
  camera_index: 0
  frame_width: 1280
  frame_height: 720
  target_fps: 15
  auto_reconnect: true
  fallback_mode: "synthetic_room" # "hardware", "browser", or "synthetic_room"

detection:
  model: "yolo-world"
  confidence_threshold: 0.35
  concepts:
    - "table"
    - "chair"
    - "laptop"
    - "phone"
    - "bottle"
    - "backpack"
    - "box"
    - "cup"
    - "book"

tracking:
  tracker_type: "bytetrack"
  max_lost_frames: 30
  iou_threshold: 0.3

scene:
  coordinate_system: "normalized_2d" # [0, 1] x [0, 1]
  spatial_relations:
    - "left_of"
    - "right_of"
    - "above"
    - "below"
    - "near"
    - "far"
    - "on"
    - "under"
    - "closest_to"
